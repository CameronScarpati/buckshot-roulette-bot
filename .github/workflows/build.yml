name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DWARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --build-config ${{ matrix.build_type }}

  readme-commands:
    # The build and test commands printed in the README, run exactly as written
    # on a clean checkout, so that they cannot drift away from what works.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Advisor
        run: ./build/advisor --position "p1=2/4[saw] p2=3/4[mg,beer] tube=2L2B turn=p1"
      # The batch stops at the load in the tube. Looking past one costs about a
      # minute and a half a round, because a solved reload deals every seat a
      # fresh handful of items and each item is another move at every turn that
      # does not end one. The advisor step above already searches through two
      # reloads on one position, which is the cheap way to cover that path.
      - name: Self play
        run: ./build/play --selfplay 20 --seed 1 --charges 2 --reloads 0
      - name: Advisor against the dealer
        run: ./build/advisor --position "p1=2/4[saw,mg] p2=4/4[beer,cuff] tube=2L3B turn=p1" --reloads 1 --opponent dealer
      - name: Advisor with the dealer to move
        run: ./build/advisor --position "p1=3/4[saw] p2=3/4[mg,beer] tube=2L2B turn=p2" --reloads 1 --opponent dealer
      # A run step has no input, so the interactive round prints its first board
      # and menu and then leaves the table at the end of input with status 0.
      - name: Play against the dealer
        timeout-minutes: 2
        run: ./build/play --opponent dealer --seed 6 --charges 2 --reloads 0
      - name: Watch the solver play the dealer
        run: ./build/play --watch --seed 6 --charges 2 --reloads 0
      - name: A batch against the dealer
        run: ./build/play --dealer 20 --seed 1 --charges 2 --reloads 0
      - name: A batch against the dealer in a story stage
        run: ./build/play --dealer 20 --seed 1 --reloads 0 --mode story2
      - name: The same seed replays the same round, the batch holds its band, and dealer loads match the script
        run: ./tools/check_play.sh build
      # Narrated sessions held to the exact position each one must leave.
      - name: Advisor sessions print the positions they narrate
        run: ./tools/check_advisor_session.sh build

  format:
    # The committed clang-format config, checked against every file, so that it
    # describes the code rather than contradicting it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          clang-format --version
          git ls-files '*.cpp' '*.h' | xargs clang-format --dry-run -Werror
      - name: Check clang-tidy
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          clang-tidy --quiet -p build engine/*.cpp solver/*.cpp cli/*.cpp

  sanitizers:
    # Index arithmetic and a hand-rolled hash deserve a run under the address
    # and undefined behaviour sanitizers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build --target tests --parallel
      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build/tests

  differential:
    # The C++ solver against an independently written Python solver. Two
    # implementations of the same rules that share no code have to agree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the advisor
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target advisor --parallel
      - name: Check the oracle against itself
        run: python3 tools/oracle/oracle.py --selftest
      - name: Compare the two solvers
        run: python3 tools/compare_solvers.py --advisor build/advisor --random 60 --seed 11 --quiet
      # The third story stage's faded band changes what healing does, so the
      # same positions are worth comparing with it switched on.
      - name: Compare the two solvers in the faded band
        run: >
          python3 tools/compare_solvers.py --advisor build/advisor --random 20 --seed 23
          --heal-floor 2 --quiet
      # The scripted dealer as the opponent, in Double or Nothing and in the story
      # stages, whose dealer runs a simpler set of rules.
      - name: Compare the two solvers against the dealer
        run: >
          python3 tools/compare_solvers.py --advisor build/advisor --opponent dealer --random 60
          --seed 13 --quiet
      - name: Compare the two solvers against the dealer in the story stages
        run: >
          python3 tools/compare_solvers.py --advisor build/advisor --opponent dealer --mode story
          --random 30 --seed 17 --quiet
      # Searching past a reload brings in the Double or Nothing loads, the deal
      # appended to each hand and a sawed barrel carried through the reload.
      # The random positions keep to small hands and short tubes, so that the
      # Python oracle can search them, and the first step checks two positions
      # at once.
      - name: Compare the two solvers through a reload
        run: >
          python3 tools/compare_solvers.py --advisor build/advisor --reloads 1 --random 20
          --seed 29 --max-items 3 --max-shells 4 --jobs 2 --quiet
      - name: Compare the two solvers through a reload that deals no items
        run: >
          python3 tools/compare_solvers.py --advisor build/advisor --reloads 1 --items-per-load 0
          --random 20 --seed 31 --quiet
      - name: Compare the two solvers against the dealer through a reload
        run: >
          python3 tools/compare_solvers.py --advisor build/advisor --opponent dealer --reloads 1
          --random 20 --seed 37 --max-items 3 --max-shells 4 --quiet
      - name: Compare the two solvers against the dealer through a reload in the story stages
        run: >
          python3 tools/compare_solvers.py --advisor build/advisor --opponent dealer --mode story
          --reloads 1 --random 15 --seed 41 --max-items 3 --quiet
      # The faded band in the story stages, where a shot stops at one charge,
      # against the dealer and against the minimising opponent.
      - name: Compare the two solvers against the dealer in the faded band
        run: >
          python3 tools/compare_solvers.py --advisor build/advisor --opponent dealer --mode story
          --heal-floor 2 --random 20 --seed 43 --quiet
      - name: Compare the two solvers in the story stages' faded band
        run: >
          python3 tools/compare_solvers.py --advisor build/advisor --mode story --heal-floor 2
          --random 20 --seed 47 --quiet

  web:
    # The engine compiled to WebAssembly for the page under web/, played through
    # seeded rounds and compared with the native advisor by the smoke test. The
    # build and test commands are those printed in web/README.md, so that they
    # cannot drift away from what works.
    runs-on: ubuntu-latest
    env:
      EMSCRIPTEN_RELEASE: "6.0.10"
    steps:
      - uses: actions/checkout@v4
      # The smoke test reads the page's own checks, which need Node 22 or newer.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Emscripten
        run: |
          git clone --depth 1 --branch "$EMSCRIPTEN_RELEASE" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install "$EMSCRIPTEN_RELEASE"
          ./emsdk activate "$EMSCRIPTEN_RELEASE"
      - name: Build the engine for the page
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build build-web --target web_engine
      - name: Build the advisor
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target advisor
      - name: Smoke test
        run: node web/test/smoke.mjs build-web/web build/advisor
